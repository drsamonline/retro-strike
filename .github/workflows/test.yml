# Test — the repo's regression guard.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# Runs tools/test.mjs: the game is one self-contained document, it makes no
# external request, the build runs and shrinks it, and the deployed demo
# (docs/play/index.html) IS the built artifact — so the live page can never
# silently serve a stale build.
#
# Runs tools/test-save.mjs: a saved run is data and is never trusted. A save with
# no player, a NaN position or a string where a number belongs is refused and the
# player is told, instead of throwing on CONTINUE every time they open the game.
#
# Runs tools/test-store.mjs: the four stores that are NOT the run save — the
# leaderboard, the campaign's unlock level, the daily best, the lifetime stats —
# get the same gate. A board row that is null used to throw on every frame of the
# LEADERBOARD, and campProg.unlocked = -3 locked every campaign level for good.

name: Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # was @v4
        with:
          node-version: "20"
      - name: Install build dependency
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: node tools/test.mjs
      - name: Run the save-hygiene tests
        run: node tools/test-save.mjs
      - name: Run the stored-state tests
        run: node tools/test-store.mjs
