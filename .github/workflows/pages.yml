name: 🚀 Deploy playable build to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Allow the workflow to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running deploy finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 📦 Stage the minified build
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🧰 Prepare site
        run: |
          mkdir -p _site
          cp dist/retro-strike.min.html _site/index.html
          [ -f assets/banner.png ] && cp assets/banner.png _site/banner.png || true
          [ -f assets/logo.png ]   && cp assets/logo.png   _site/logo.png   || true

      - name: ⚙️ Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # turn on Pages (GitHub Actions source) on first run

      - name: ⬆️ Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 🌐 Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
