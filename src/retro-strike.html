<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>RETRO STRIKE — 3rd Person Shooter</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #050510; display: flex; align-items: center; justify-content: center;
               overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
               -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #frame { position: relative; width: min(96vw, calc(92vh * 1.6)); aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden;
           box-shadow: 0 0 0 4px #1e1e3a, 0 0 40px rgba(124,58,237,0.4), 0 0 90px rgba(232,121,249,0.2); touch-action: none; }
  canvas { width: 100%; height: 100%; display: block; object-fit: contain; image-rendering: pixelated; image-rendering: crisp-edges;
           background: #000; cursor: crosshair; touch-action: none; }
  #crt { position: absolute; inset: 0; pointer-events: none;
         background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px); }
  #vig { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 90px rgba(0,0,0,0.65); }
  /* ---- touch controls ---- */
  #touch { display: none; position: absolute; inset: 0; z-index: 5; touch-action: none; }
  #stick { display: none; position: absolute; width: 110px; height: 110px; border-radius: 50%;
           border: 2px solid rgba(232,121,249,0.55); background: rgba(20,20,40,0.3); pointer-events: none; }
  #knob { position: absolute; left: 32px; top: 32px; width: 46px; height: 46px; border-radius: 50%;
          background: rgba(232,121,249,0.5); border: 2px solid rgba(255,255,255,0.6); pointer-events: none; }
  #fireBtn { position: absolute; right: 4%; bottom: calc(16% + env(safe-area-inset-bottom, 0px)); width: 84px; height: 84px; border-radius: 50%;
             border: 2px solid #fde047; background: rgba(239,68,68,0.35); color: #fff; font: bold 15px monospace;
             display: flex; align-items: center; justify-content: center; letter-spacing: 1px; pointer-events: none; }
  #fireBtn.on { background: rgba(239,68,68,0.8); }
  #swapBtn { position: absolute; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 46px; border-radius: 10px;
             border: 2px solid #7dd3fc; background: rgba(15,15,35,0.6); color: #f8fafc; font: bold 10px monospace;
             display: flex; align-items: center; justify-content: center; letter-spacing: 1px; pointer-events: none; }
  #nadeBtn { position: absolute; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 46px; border-radius: 10px;
             border: 2px solid #fb923c; background: rgba(15,15,35,0.6); color: #f8fafc; font: bold 10px monospace;
             display: flex; align-items: center; justify-content: center; letter-spacing: 1px; pointer-events: none; }
  #dashBtn { position: absolute; left: calc(84px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 46px; border-radius: 10px;
             border: 2px solid #4ade80; background: rgba(15,15,35,0.6); color: #f8fafc; font: bold 10px monospace;
             display: flex; align-items: center; justify-content: center; letter-spacing: 1px; pointer-events: none; }
  #melBtn { position: absolute; left: calc(84px + env(safe-area-inset-left, 0px)); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 46px; border-radius: 10px;
            border: 2px solid #f472b6; background: rgba(15,15,35,0.6); color: #f8fafc; font: bold 10px monospace;
            display: flex; align-items: center; justify-content: center; letter-spacing: 1px; pointer-events: none; }
  #fsBtn { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); z-index: 6; width: 38px; height: 38px; border-radius: 9px;
           border: 2px solid rgba(232,121,249,0.6); background: rgba(15,15,35,0.6); color: #f8fafc; font: bold 19px monospace;
           display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none; }
  #fsBtn:active { background: rgba(232,121,249,0.45); }
  /* left-handed layout: mirror control clusters */
  #touch.lefty #fireBtn { left: 4%; right: auto; }
  #touch.lefty #swapBtn { right: calc(10px + env(safe-area-inset-right, 0px)); left: auto; }
  #touch.lefty #nadeBtn { right: calc(10px + env(safe-area-inset-right, 0px)); left: auto; }
  #touch.lefty #dashBtn { right: calc(84px + env(safe-area-inset-right, 0px)); left: auto; }
  #touch.lefty #melBtn { right: calc(84px + env(safe-area-inset-right, 0px)); left: auto; }
  /* big touch buttons (accessibility) */
  #touch.big #fireBtn { width: 104px; height: 104px; }
  #touch.big #swapBtn, #touch.big #nadeBtn, #touch.big #dashBtn, #touch.big #melBtn { width: 78px; height: 54px; }
  @media (max-width: 900px), (pointer: coarse) {
    html, body { background: #000; }
    /* keep the 16:10 canvas aspect and letterbox it — never stretch the pixels */
    #frame { width: min(100vw, calc(100dvh * 1.6)); height: auto; aspect-ratio: 16 / 10; border-radius: 0; box-shadow: none; }
  }
  /* JS-applied fallback: same letterboxed layout when media queries misreport the viewport */
  #frame.mobile { width: min(100vw, calc(100dvh * 1.6)); height: auto; aspect-ratio: 16 / 10; border-radius: 0; box-shadow: none; }
  /* portrait hint (touch devices) */
  #rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #050510; color: #e879f9;
            font: bold 15px/1.7 monospace; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 24px; }
  #rotate.show { display: flex; }
  #rotate .big { font-size: 22px; color: #fde047; letter-spacing: 1px; }
  #rotate .sub { font-size: 11px; color: #94a3b8; margin-top: 16px; }

<script>
"use strict";
// ================= setup =================
var W = 320, H = 200, FOCAL = (W / 2) / Math.tan(1.15 / 2), NEAR = 0.2;
var cv = document.getElementById("game");
var ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
var crtEl = document.getElementById("crt");

// ================= settings (persisted) =================
var SET = { vol: 0.8, lastVol: 0.8, music: 1, scan: 1, sens: 1, cross: 0, fov: 90, assist: 1, dmgNum: 1, fps: 0, bigBtn: 0, lefty: 0, bigUI: 0, keys: 0, ghost: 1, skin: 0 };
try {
  var so0 = JSON.parse(localStorage.getItem("retroStrikeSet") || "null");
  if (so0) for (var sk0 in so0) if (SET[sk0] !== undefined) SET[sk0] = so0[sk0];
} catch (e) {}
function updateFocal() { FOCAL = (W / 2) / Math.tan((SET.fov || 90) * Math.PI / 360); }
updateFocal();
function saveSettings() { try { localStorage.setItem("retroStrikeSet", JSON.stringify(SET)); } catch (e) {} }
function applySettings() {
  if (crtEl) crtEl.style.display = SET.scan ? "block" : "none";
  var tel = document.getElementById("touch");
  if (tel) {
    if (SET.lefty) tel.classList.add("lefty"); else tel.classList.remove("lefty");
    if (SET.bigBtn) tel.classList.add("big"); else tel.classList.remove("big");
  }
}
applySettings();
var KP = { f: "KeyW", b: "KeyS", l: "KeyA", r: "KeyD" };
function applyKeyPreset() { KP = SET.keys === 1 ? { f: "KeyZ", b: "KeyS", l: "KeyQ", r: "KeyD" } : { f: "KeyW", b: "KeyS", l: "KeyA", r: "KeyD" }; }
applyKeyPreset();
var ASSIST_CONE = [0.12, 0.3, 0.5], ASSIST_HOM = [1.2, 3.4, 5.2];

// ================= audio (chiptune sfx + music) =================
var AC = null;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === "suspended") { try { AC.resume(); } catch (e) {} }
}
function beep(f, d, type, v, slide) {
  if (!AC) return;
  try {
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.linearRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime((v || 0.07) * SET.vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + d);
  } catch (e) {}
}
function musNote(f, at, d, type, v) {
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, at);
    g.gain.setValueAtTime(v * SET.vol, at);
    g.gain.exponentialRampToValueAtTime(0.001, at + d);
    o.connect(g); g.connect(AC.destination);
    o.start(at); o.stop(at + d);
  } catch (e) {}
}
var jingleQ = [];
function jingle() { jingleQ = [[0, 523, 0.09], [0.09, 659, 0.09], [0.18, 784, 0.14]]; }
function pumpJingle() {
  var i, n;
  for (i = jingleQ.length - 1; i >= 0; i--) {
    n = jingleQ[i];
    n[0] -= 1 / 60;
    if (n[0] <= 0) { beep(n[1], n[2], "square", 0.07); jingleQ.splice(i, 1); }
  }
}
// procedural chiptune loop: bass + arpeggio, shifts with day/night and wave
var musNext = 0, musStep = 0;
function pumpMusic() {
  if (!AC || !SET.music) return;
  if (state !== "play" && state !== "title" && state !== "menu") return;
  var t = AC.currentTime;
  if (musNext < t) musNext = t + 0.06;
  var root = daylight < 0.4 ? 110 : 146.8;
  var BPM = 96 + Math.min(60, wave * 5);
  var st16 = 60 / BPM / 4;
  var bassP = [0, 0, 7, 0, 5, 0, 3, 0, 0, 0, 7, 0, 10, 0, 8, 7];
  var leadP = [12, 15, 19, 24, 22, 19, 15, 17];
  while (musNext < t + 0.16) {
    var st = musStep % 32;
    if (st % 2 === 0) musNote(root * Math.pow(2, bassP[(st / 2) | 0] / 12), musNext, st16 * 1.8, "triangle", 0.05);
    if (st % 4 === 2) musNote(root * 2 * Math.pow(2, leadP[((st >> 2) + (musStep >> 5)) % 8] / 12), musNext, st16, "square", 0.02);
    musStep++;
    musNext += st16;
  }
}
function noiseSfx(d, v) {
  if (!AC) return;
  try {
    var t = AC.currentTime, n = Math.floor(AC.sampleRate * d), buf = AC.createBuffer(1, n, AC.sampleRate), ch = buf.getChannelData(0), i;
    for (i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = AC.createBufferSource(); s.buffer = buf;
    var g = AC.createGain(); g.gain.value = (v || 0.1) * SET.vol;
    s.connect(g); g.connect(AC.destination); s.start(t);
  } catch (e) {}
}

// ================= palette & pixel sprites =================
var PAL = {
  K: "#12121e", S: "#d8a06c", J: "#18b6a8", j: "#0d7a72", P: "#3a3f8f", B: "#2b2b3a",
  G: "#8b8f9a", g: "#52565e",
  M: "#4ade80", d: "#15803d", R: "#ef4444", T: "#f8fafc",
  V: "#a855f7", s: "#3b0764", W: "#f8fafc",
  o: "#b45309", u: "#7c2d12", y: "#fde047", c: "#38bdf8", O: "#fb923c"
};
var PAL_FLASH = {};
(function () { for (var k in PAL) PAL_FLASH[k] = "#ffffff"; })();
var SKINS = [
  { n: "CLASSIC", p: null },
  { n: "CRIMSON", p: { J: "#ef4444", j: "#991b1b", P: "#7f1d1d" }, req: 2 },
  { n: "SOLAR", p: { J: "#f59e0b", j: "#b45309", P: "#78350f" }, req: 5 },
  { n: "VOID", p: { J: "#8b5cf6", j: "#5b21b6", P: "#4c1d95" }, req: 8 },
  { n: "GHOST", p: { J: "#e2e8f0", j: "#94a3b8", P: "#475569" }, req: 11 }
];
// clamp persisted settings so a corrupt/tampered save can never break rendering
(function () {
  function pick(v, arr, d) { return arr.indexOf(v) >= 0 ? v : d; }
  SET.vol = (typeof SET.vol === "number" && SET.vol >= 0 && SET.vol <= 1) ? SET.vol : 0.8;
  SET.lastVol = (typeof SET.lastVol === "number" && SET.lastVol > 0 && SET.lastVol <= 1) ? SET.lastVol : 0.8;
  SET.sens = pick(SET.sens, [0.5, 0.75, 1, 1.25, 1.5], 1);
  SET.fov = pick(SET.fov, [70, 80, 90, 100], 90);
  SET.assist = pick(SET.assist, [0, 1, 2], 1);
  SET.cross = pick(SET.cross, [0, 1, 2], 0);
  SET.skin = (typeof SET.skin === "number" && SET.skin >= 0 && SET.skin < SKINS.length) ? SET.skin : 0;
  SET.keys = SET.keys ? 1 : 0;
})();
updateFocal();
applyKeyPreset();

var PLAYER_BMP = [
  "...KKKK...",
  "..KKKKKK..",
  "..KKKKKK..",
  "...SSSS...",
  "..JJJJJg..",
  "..JJJJJGG.",
  ".JJJJJJGGG",
  ".jJJJJJ.G.",
  "..PPPPPP..",
  "..PP..PP..",
  "..PP..PP..",
  "..BB..BB.."
];
var GRUNT_BMP = [
  "..MMMM..",
  ".MMMMMM.",
  ".MRMMRM.",
  "MMMMMMMM",
  "MTMMMMTM",
  ".MMMMMM.",
  "MdMMMMdM",
  "MdMMMMdM",
  "..MMMM..",
  "..MM.MM.",
  "..d..d.."
];
var RUNNER_BMP = [
  "..OOOO..",
  ".OORROO.",
  ".OOOOOO.",
  "OOROOROO",
  "OOOOOOOO",
  ".OOOOOO.",
  ".OO..OO.",
  "..O..O..",
  "..O..O.."
];
var TANK_BMP = [
  "..VVVV...",
  ".VVVVVV..",
  ".VWWVVV..",
  "VVVVVVVV.",
  "VTTTVVVV.",
  "VVVVVVVV.",
  "sVVVVVVVs",
  "ssVVVVVss",
  ".VVVVVV..",
  ".VV..VV.."
];
var MEDKIT_BMP = [".RRRRR.", "RRRWRRR", "RRWWWRR", "RRRWRRR", ".RRRRR."];
var STAR_BMP = ["..y..", ".yyy.", "yyyyy", ".yyy.", "..y.."];
var AMMO_BMP = ["GGGGGG", "GgRRgG", "GgRRgG", "GgWWgG", "GGGGGG"];
var WEAP_BMP = ["VVVVVVV", "VWWVWWV", "VVVVVVV", "VsVVVsV", "VVVVVVV"];
var CHEST_BMP = [".oooooo.", "oooooooo", "oyyyyyyo", "ooyTTyoo", "oooooooo", ".uuuuuu.", ".uu.uuu."];
var BARREL_BMP = [".oooo.", "oOOOOo", "oOooOo", "oOOOOo", "oOooOo", ".uuuu."];
var TREE_BMP = ["..MM..", ".MMMM.", "MMdMMM", ".MMMM.", "..MM..", "..o...", "..o..."];
var ROCK_BMP = [".GGG.", "GGgGG", "GgGGG", ".GGG."];
var LAMP_BMP = [".yy.", ".yy.", "..K.", "..K.", "..K.", "..K."];
var MINE_BMP = [".R.", "RyR", ".R."];
var DRONE_BMP = ["cc", "cc"];
var PAL_SPLIT = { M: "#14b8a6", d: "#115e59", R: "#f8fafc", T: "#0f172a" };
var PAL_SHIELD = { V: "#3b82f6", s: "#1e3a8a", W: "#93c5fd", T: "#0f172a" };
var PAL_KAMI = { O: "#ef4444", R: "#fde047" };
var PAL_KAMI_HOT = { O: "#ffffff", R: "#ef4444" };
var PAL_DUMMY = { M: "#94a3b8", d: "#475569", R: "#64748b", T: "#0f172a" };
var PAL_MINE_OFF = { R: "#7f1d1d", y: "#7c2d12" };
var PAL_PK_SHIELD = { R: "#38bdf8", W: "#e0f2fe" };
var PAL_PK_UPGRADE = { V: "#fde047", s: "#b45309", W: "#fff" };
var PAL_PK_CLUSTER = { R: "#38bdf8", y: "#fde047" };

// ================= weapons =================
var WEAPONS = {
  blaster: { name: "BLASTER", letter: "B", rate: 0.16, dmg: 12, spd: 16, res: null },
  spread:  { name: "SPREAD",  letter: "S", rate: 0.55, dmg: 9,  spd: 13, res: "shells", pellets: 5, spread: 0.16 },
  rifle:   { name: "RIFLE",   letter: "R", rate: 0.07, dmg: 9,  spd: 19, res: "cells" },
  beam:    { name: "BEAM",    letter: "X", rate: 0.42, dmg: 34, spd: 26, res: "cores", pierce: true }
};
var WORDER = ["blaster", "spread", "rifle", "beam"];

// ================= world =================
var MS = 48, WH = 1.7;
var map = new Uint8Array(MS * MS);
var lava = new Uint8Array(MS * MS);
var reachList = [], secrets = [], barrels = [], decor = [];
var wallCells = [], lavaCells = []; // precomputed cell indices (perf: minimap iterates these, not the whole grid)
// seeded xorshift PRNG for world generation (cheap + reproducible arenas)
var seed = 0x9e3779b9;
function srand(s) { seed = (s | 0) || 0x9e3779b9; }
function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }
function isWall(x, z) {
  if (x < 0 || z < 0 || x >= MS || z >= MS) return true;
  return map[z * MS + x] === 1;
}
// biome quadrants: 0 default, 1 = NE ice, 2 = SW lava
function biomeOf(x, z) {
  if (x >= MS / 2 && z < MS / 2) return 1;
  if (x < MS / 2 && z >= MS / 2) return 2;
  return 0;
}
function lavaAt(x, z) {
  var gx = Math.floor(x), gz = Math.floor(z);
  if (gx < 0 || gz < 0 || gx >= MS || gz >= MS) return false;
  return lava[gz * MS + gx] === 1;
}
function genMap() {
  var i, x, z, w, h, dx, dz, gx, gz, ok;
  srand(arenaSeed);
  map.fill(0); lava.fill(0);
  for (i = 0; i < MS; i++) { map[i] = 1; map[(MS - 1) * MS + i] = 1; map[i * MS] = 1; map[i * MS + MS - 1] = 1; }
  var cx = MS / 2 - 0.5, cz = MS / 2 - 0.5;
  var placed = 0, tries = 0;
  while (placed < 85 && tries < 1200) {
    tries++;
    x = 2 + Math.floor(rnd() * (MS - 5)); z = 2 + Math.floor(rnd() * (MS - 5));
    w = rnd() < 0.5 ? 1 : (rnd() < 0.5 ? 2 : 3);
    h = rnd() < 0.5 ? 1 : 2;
    ok = true;
    // 1-cell margin around every block keeps corridors open (no merged clusters)
    for (dx = -1; dx < w + 1; dx++) for (dz = -1; dz < h + 1; dz++) {
      gx = x + dx; gz = z + dz;
      if ((gx - cx) * (gx - cx) + (gz - cz) * (gz - cz) < 14) ok = false;
      if (map[gz * MS + gx]) ok = false;
    }
    if (!ok) continue;
    for (dx = 0; dx < w; dx++) for (dz = 0; dz < h; dz++) map[(z + dz) * MS + (x + dx)] = 1;
    placed++;
  }
  // carve open plazas for breathing room
  var pl = 0, pt2 = 0, pxx, pzz;
  while (pl < 4 && pt2 < 200) {
    pt2++;
    pxx = 5 + Math.floor(rnd() * (MS - 10)); pzz = 5 + Math.floor(rnd() * (MS - 10));
    if (Math.hypot(pxx - cx, pzz - cz) < 7) continue;
    for (dx = -2; dx <= 2; dx++) for (dz = -2; dz <= 2; dz++) {
      gx = pxx + dx; gz = pzz + dz;
      if (gx > 0 && gz > 0 && gx < MS - 1 && gz < MS - 1) map[gz * MS + gx] = 0;
    }
    pl++;
  }
  floodFillCenter();
  // lava hazard tiles in the SW quadrant
  for (z = 2; z < MS - 2; z++) for (x = 2; x < MS / 2; x++) {
    if (z >= MS / 2 && !map[z * MS + x] && ((x * 7 + z * 13) % 9 === 0)) lava[z * MS + x] = 1;
  }
  placeSecrets(12, 20);
  placeProps();
  indexCells();
}
function floodFillCenter() {
  var z, x, cx = MS / 2 - 0.5, cz = MS / 2 - 0.5;
  var reach = new Uint8Array(MS * MS);
  var q = [Math.floor(cz) * MS + Math.floor(cx)];
  reach[q[0]] = 1;
  while (q.length) {
    var c = q.pop();
    var cxx = c % MS, czz = (c - cxx) / MS;
    if (cxx > 0 && !map[czz * MS + cxx - 1] && !reach[czz * MS + cxx - 1]) { reach[czz * MS + cxx - 1] = 1; q.push(czz * MS + cxx - 1); }
    if (cxx < MS - 1 && !map[czz * MS + cxx + 1] && !reach[czz * MS + cxx + 1]) { reach[czz * MS + cxx + 1] = 1; q.push(czz * MS + cxx + 1); }
    if (czz > 0 && !map[(czz - 1) * MS + cxx] && !reach[(czz - 1) * MS + cxx]) { reach[(czz - 1) * MS + cxx] = 1; q.push((czz - 1) * MS + cxx); }
    if (czz < MS - 1 && !map[(czz + 1) * MS + cxx] && !reach[(czz + 1) * MS + cxx]) { reach[(czz + 1) * MS + cxx] = 1; q.push((czz + 1) * MS + cxx); }
  }
  reachList = [];
  for (z = 0; z < MS; z++) for (x = 0; x < MS; x++) if (reach[z * MS + x]) reachList.push([x, z]);
}
function indexCells() {
  var z, x, c;

  // secret chests: sparkle hints + pickup
  var i, s2;
  for (i = 0; i < secrets.length; i++) {
    s2 = secrets[i];
    if (s2.found) continue;
    s2.t += dt;
    var sd = Math.hypot(s2.x - player.x, s2.z - player.z);
    if (s2.t > 0.6 && sd < 22) {
      s2.t = 0;
      parts.push({ x: s2.x + (Math.random() - 0.5) * 0.6, y: 0.4 + Math.random() * 0.5, z: s2.z + (Math.random() - 0.5) * 0.6,
                   vx: 0, vy: 1.2, vz: 0, life: 0.7, c: "#fde047", s: 0.05 });
    }
    if (sd < 0.9) {
      s2.found = true;
      secretsFound++;
      if (secretsFound >= secrets.length) unlock("secrets");
      score += 500;
      player.ammo.shells += 4; player.ammo.cells += 20; player.ammo.cores += 3;
      setObjMsg("SECRET CHEST FOUND!  +500", 3.5);
      scorePops.push({ x: s2.x, z: s2.z, t: 0, txt: "+500" });
      spark(s2.x, 0.6, s2.z, "#fde047", 16);
      jingle();
    }
  }

  // bullets
  var b;
  for (i = bullets.length - 1; i >= 0; i--) {
    b = bullets[i];
    if (b.tgt && b.tgt.hp > 0) {
      var ta = Math.atan2(b.tgt.z - b.z, b.tgt.x - b.x);
      var cur = Math.atan2(b.dz, b.dx);
      var dd = angDiff(ta, cur);
      var mt = ASSIST_HOM[SET.assist] * dt;
      if (Math.abs(dd) <= mt) cur = ta;
      else cur += dd > 0 ? mt : -mt;
      b.dx = Math.cos(cur); b.dz = Math.sin(cur);
    }
    b.x += b.dx * b.spd * dt;
    b.z += b.dz * b.spd * dt;
    b.life -= dt;
    var dead = b.life <= 0;
    if (!dead && isWall(Math.floor(b.x), Math.floor(b.z))) {
      dead = true;
      spark(b.x, b.y, b.z, "#cbd5e1", 4);
    }
    if (!dead && b.foe) {
      if ((b.x - player.x) * (b.x - player.x) + (b.z - player.z) * (b.z - player.z) < 0.45) {
        dead = true;
        hurtPlayer(b.dmg || 10);
      }
    }
    if (!dead && !b.foe) {
      // explosive barrels
      var bi;
      for (bi = 0; bi < barrels.length; bi++) {
        var bk2 = barrels[bi];
        if (bk2.dead) continue;
        if ((b.x - bk2.x) * (b.x - bk2.x) + (b.z - bk2.z) * (b.z - bk2.z) < 0.36) {
          dead = true;
          bk2.dead = true;
          stats.barrels++;
          explodeAt(bk2.x, bk2.z, 50, 2.4, true, false);
          break;
        }
      }
    }
    if (!dead && !b.foe) {
      for (var j = 0; j < enemies.length; j++) {
        var e = enemies[j];
        if (e.hp <= 0 || e.spawnT > 0) continue;
        var rr = e.r + 0.25;
        if ((b.x - e.x) * (b.x - e.x) + (b.z - e.z) * (b.z - e.z) < rr * rr) {
          if (b.pierce) {
            if (b.hit !== e) { hitEnemy(e, b); b.hit = e; }
          } else {
            dead = true;
            hitEnemy(e, b);
            break;
          }
        }
      }
    }
    if (dead) bullets.splice(i, 1);
  }

  // dash
  if (dashCd > 0) dashCd -= dt;
  if (dashT > 0) {
    dashT -= dt;
    var dnx = player.x + dashDx * 13 * dt, dnz = player.z + dashDz * 13 * dt;
    if (!blocked(dnx, player.z, 0.32)) player.x = dnx;
    if (!blocked(player.x, dnz, 0.32)) player.z = dnz;
    parts.push({ x: player.x, y: 0.3, z: player.z, vx: 0, vy: 0.4, vz: 0, life: 0.3, c: "#a5f3fc", s: 0.07 });
  }

  // grenades / clusters
  for (i = nades.length - 1; i >= 0; i--) {
    var ng = nades[i];
    ng.fuse -= dt;
    ng.vy -= 12 * dt;
    var nx3 = ng.x + ng.vx * dt, nz3 = ng.z + ng.vz * dt;
    if (isWall(Math.floor(nx3), Math.floor(ng.z))) ng.vx *= -0.5; else ng.x = nx3;
    if (isWall(Math.floor(ng.x), Math.floor(nz3))) ng.vz *= -0.5; else ng.z = nz3;
    ng.y += ng.vy * dt;
    if (ng.y <= 0.15) { ng.y = 0.15; ng.vy *= -0.45; ng.vx *= 0.7; ng.vz *= 0.7; }
    if (ng.fuse <= 0) {
      explodeAt(ng.x, ng.z, 70, 3, true, true);
      if (ng.cl) {
        var ck;
        for (ck = 0; ck < 3; ck++) {
          var ca = Math.random() * Math.PI * 2, cs = 2 + Math.random() * 2;
          nades.push({ x: ng.x, y: 0.3, z: ng.z, vx: Math.cos(ca) * cs, vz: Math.sin(ca) * cs, vy: 2.5, fuse: 0.45, cl: false });
        }
      }
      nades.splice(i, 1);
    }
  }

  // mines
  for (i = mines.length - 1; i >= 0; i--) {
    var mn = mines[i];
    mn.t += dt;
    if (mn.arm > 0) { mn.arm -= dt; continue; }
    var mi, trig = false;
    for (mi = 0; mi < enemies.length; mi++) {
      if (enemies[mi].hp > 0 && enemies[mi].spawnT <= 0 && Math.hypot(enemies[mi].x - mn.x, enemies[mi].z - mn.z) < 1.1) { trig = true; break; }
    }
    if (trig || mn.t > 20) { explodeAt(mn.x, mn.z, 60, 2.2, true, true); mines.splice(i, 1); }
  }

  // enemies
  for (i = enemies.length - 1; i >= 0; i--) {
    var en = enemies[i];
    if (en.hp <= 0) { die(en, i); continue; }
    en.hitT = Math.max(0, en.hitT - dt);
    if (en.spawnT > 0) { en.spawnT -= dt; continue; }
    en.cd -= dt;
    en.wob += dt * 6;
    var edx = player.x - en.x, edz = player.z - en.z;
    var edist = Math.hypot(edx, edz) || 0.001;
    var mvx = 0, mvz = 0;
    if (en.type === "dummy") {
      // stationary training target
    } else if (en.type === "grunt" || en.type === "runner" || en.type === "mini" || en.type === "splitter") {
      if (edist > 0.9) { mvx = edx / edist; mvz = edz / edist; }
    } else if (en.type === "kami") {
      mvx = edx / edist; mvz = edz / edist;
      if (edist < 1.3) {
        explodeAt(en.x, en.z, 34, 2.2, true, false);
        // the blast may already have removed this enemy (and others) — remove by identity, never a stale index
        var ki = enemies.indexOf(en);
        if (ki >= 0) die(en, ki);
        continue;
      }
    } else if (en.type === "boss") {
      if (!en.p2 && en.hp < en.maxhp / 2) {
        en.p2 = true; en.speed *= 1.35; en.cd = 1;
        toast("BOSS ENRAGED!", 2);
        beep(120, 0.5, "sawtooth", 0.1, 60);
        spark(en.x, 1, en.z, "#ef4444", 20);
      }
      if (edist > 9) { mvx = edx / edist; mvz = edz / edist; }
      else if (en.cd <= 0) { en.cd = en.p2 ? 2 : 3; bossBurst(en); }
    } else {
      if (edist > 7.5) { mvx = edx / edist; mvz = edz / edist; }
      else if (en.cd <= 0) { en.cd = 2.2; spit(en); }
    }
    if (mvx !== 0 || mvz !== 0) {
      var sp = en.speed * (0.9 + 0.1 * Math.sin(en.wob));
      var ex = en.x + mvx * sp * dt, ez = en.z + mvz * sp * dt;
      if (!blocked(ex, en.z, en.r * 0.8)) en.x = ex;
      if (!blocked(en.x, ez, en.r * 0.8)) en.z = ez;
    }
    if ((en.type === "grunt" || en.type === "runner" || en.type === "mini" || en.type === "splitter") && edist < 0.85 && player.hurtT <= 0) {
      hurtPlayer(Math.round((en.type === "runner" ? 8 : (en.type === "mini" ? 5 : 12)) * DIFFS[diff].dmg));
      en.x -= edx / edist * 0.6;
      en.z -= edz / edist * 0.6;
    }
  }

  // enemy separation
  var a2, b3, dx2, dz2, d2, md, dd2, push;
  for (i = 0; i < enemies.length; i++) for (var q = i + 1; q < enemies.length; q++) {
    a2 = enemies[i]; b3 = enemies[q];
    dx2 = b3.x - a2.x; dz2 = b3.z - a2.z;
    d2 = dx2 * dx2 + dz2 * dz2;
    md = a2.r + b3.r;
    if (d2 < md * md && d2 > 0.0001) {
      dd2 = Math.sqrt(d2); push = (md - dd2) / 2;
      a2.x -= dx2 / dd2 * push; a2.z -= dz2 / dd2 * push;
      b3.x += dx2 / dd2 * push; b3.z += dz2 / dd2 * push;
    }
  }

  // companion drone
  if (player.drone) {
    droneA += dt * 1.6;
    droneCd -= dt;
    var dxp = player.x + Math.cos(droneA) * 1.4, dzp = player.z + Math.sin(droneA) * 1.4;
    if (droneCd <= 0) {
      var best = null, bd = 11, k;
      for (k = 0; k < enemies.length; k++) {
        if (enemies[k].hp <= 0 || enemies[k].spawnT > 0) continue;
        var dk = Math.hypot(enemies[k].x - dxp, enemies[k].z - dzp);
        if (dk < bd) { bd = dk; best = enemies[k]; }
      }
      if (best) {
        droneCd = 0.9;
        var da = Math.atan2(best.z - dzp, best.x - dxp);
        bullets.push({ x: dxp, y: 1.7, z: dzp, dx: Math.cos(da), dz: Math.sin(da), spd: 14, life: 1, foe: false, dmg: 6, tgt: best, pierce: false, hit: null, w: "drone" });
        beep(980, 0.04, "square", 0.03, 1400);
      }
    }
  }

  // particles
  for (i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.life -= dt;
    p.vy -= 9 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (p.y < 0) { p.y = 0; p.vy *= -0.4; p.vx *= 0.6; p.vz *= 0.6; }
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (i = scorePops.length - 1; i >= 0; i--) {
    scorePops[i].t += dt;
    if (scorePops[i].t > 0.9) scorePops.splice(i, 1);
  }

  // pickups
  for (i = pickups.length - 1; i >= 0; i--) {
    var pk = pickups[i];
    pk.t += dt;
    if ((pk.x - player.x) * (pk.x - player.x) + (pk.z - player.z) * (pk.z - player.z) < 0.6) {
      if (pk.kind === "medkit") {
        player.hp = Math.min(player.maxhp, player.hp + 35);
        setObjMsg("MEDKIT  +35 HP", 2);
      } else if (pk.kind === "ammo") {
        if (pk.sub === "shells") player.ammo.shells += 6;
        else if (pk.sub === "cells") player.ammo.cells += 35;
        else player.ammo.cores += 4;
        setObjMsg("AMMO PICKED UP", 2);
      } else if (pk.kind === "star") {
        score += 250;
        setObjMsg("GOLD STAR  +250", 2);
      } else if (pk.kind === "nade") {
        player.nades = Math.min(5, player.nades + 2);
        setObjMsg("GRENADES +2", 2);
      } else if (pk.kind === "mine") {
        player.mines = Math.min(4, player.mines + 1);
        setObjMsg("MINES +1", 2);
      } else if (pk.kind === "cluster") {
        player.cluster = Math.min(6, player.cluster + 2);
        setObjMsg("CLUSTERS +2", 2);
      } else if (pk.kind === "shield") {
        player.shield = Math.min(50, player.shield + 25);
        setObjMsg("SHIELD +25", 2);
      } else if (pk.kind === "upgrade") {
        if (player.up < 3) { player.up++; setObjMsg("WEAPON UPGRADE LEVEL " + player.up, 2.5); }
        else { score += 200; setObjMsg("UPGRADE MAXED +200", 2); }
        jingle();
      } else if (pk.kind === "drone") {
        player.drone = true;
        setObjMsg("DRONE COMPANION ONLINE", 2.5);
        jingle();
      } else if (pk.kind === "weapon") {
        grantWeapon(pk.sub);
      }
      spark(pk.x, 0.5, pk.z, "#fde047", 6);
      beep(660, 0.12, "square", 0.08, 990);
      pickups.splice(i, 1);
    }
  }
}
function campWin() {
  if (campObj.done) return;
  campObj.done = true;
  state = "over";
  MSC = "over";
  menuIdx = 0;
  score += 500 + campLvl * 250;
  toast("LEVEL " + campLvl + " CLEAR!", 3);
  if (campLvl >= campProg.unlocked && campLvl < 8) {
    campProg.unlocked = campLvl + 1;
    try { localStorage.setItem("retroStrikeCamp", JSON.stringify(campProg)); } catch (e) {}
  }
  stats.waves += campObj.kind === "waves" ? campObj.n : 1;
  saveStats();
  jingle();
}

// ================= render =================
function addWall(gx, gz, arr) {
  var x0 = gx, x1 = gx + 1, z0 = gz, z1 = gz + 1;
  var cx = gx + 0.5 - cam.x, cz = gz + 0.5 - cam.z;
  var dd = Math.sqrt(cx * cx + cz * cz);
  if (dd > 2.5 && cx * cam.f[0] + cz * cam.f[2] < -0.25 * dd) return; // fully behind camera, never visible
  if (cam.z < z0) arr.push({ d: dd, draw: (function (pts, c) { return function () { drawQuad(pts, c); }; })([[x0, 0, z0], [x1, 0, z0], [x1, WH, z0], [x0, WH, z0]], shadeCached(0, dd)) });
  if (cam.z > z1) arr.push({ d: dd, draw: (function (pts, c) { return function () { drawQuad(pts, c); }; })([[x1, 0, z1], [x0, 0, z1], [x0, WH, z1], [x1, WH, z1]], shadeCached(1, dd)) });
  if (cam.x < x0) arr.push({ d: dd, draw: (function (pts, c) { return function () { drawQuad(pts, c); }; })([[x0, 0, z1], [x0, 0, z0], [x0, WH, z0], [x0, WH, z1]], shadeCached(2, dd)) });
  if (cam.x > x1) arr.push({ d: dd, draw: (function (pts, c) { return function () { drawQuad(pts, c); }; })([[x1, 0, z0], [x1, 0, z1], [x1, WH, z1], [x1, WH, z0]], shadeCached(3, dd)) });
  arr.push({ d: dd, draw: (function (pts, c) { return function () { drawQuad(pts, c); }; })([[x0, WH, z0], [x0, WH, z1], [x1, WH, z1], [x1, WH, z0]], shadeCached(4, dd)) });
}

function render() {
  updateCam();
  fcolCache = {};
  ctx.save();
  if (shake > 0.1) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // --- sky: day / night cycle ---
  var far = toCam(player.x + Math.cos(player.yaw) * 300, 0, player.z + Math.sin(player.yaw) * 300);
  var hor = (far[2] > 0.5) ? projC(far)[1] : 45;
  if (hor < 2) hor = 2;
  var skyTop = mix3(C_NIGHT.top, C_DAY.top, daylight);
  var skyBot = mix3(C_NIGHT.bot, C_DAY.bot, daylight);
  var sgk = ((daylight * 40) | 0) + "-" + (hor | 0);
  if (sgk !== skyGradKey) {
    skyGradKey = sgk;
    skyGrad = ctx.createLinearGradient(0, 0, 0, hor);
    skyGrad.addColorStop(0, rgbStr(skyTop));
    skyGrad.addColorStop(1, rgbStr(skyBot));
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(-8, -8, W + 16, hor + 8);
  // stars
  if (daylight < 0.55) {
    var sa = (0.55 - daylight) / 0.55, i;
    ctx.fillStyle = "rgba(248,250,252," + (sa * 0.9).toFixed(2) + ")";
    for (i = 0; i < stars.length; i++) {
      var sx = W / 2 + Math.cos(stars[i].a + player.yaw) * stars[i].e * 1.9;
      var sy2 = hor - 10 - stars[i].e * 0.42;
      if (sx < 0 || sx > W) continue;
      ctx.fillRect(sx, sy2, stars[i].s, stars[i].s);
    }
  }
  // sun & moon
  var sunA = SUN_A + (time / DAY_LEN) * Math.PI * 2;
  var moonA = MOON_A + (time / DAY_LEN) * Math.PI * 2;
  var sunX = W / 2 + Math.cos(sunA - player.yaw) * 120, sunY = hor - Math.sin(sunA) * 95;
  var moonX = W / 2 + Math.cos(moonA - player.yaw) * 120, moonY = hor - Math.sin(moonA) * 95;
  if (sunY < hor + 10 && daylight > 0.2) {
    ctx.fillStyle = "rgba(253,224,71,0.95)";
    ctx.beginPath(); ctx.arc(sunX, sunY, 5, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(253,224,71,0.25)";
    ctx.beginPath(); ctx.arc(sunX, sunY, 9, 0, 7); ctx.fill();
  }
  if (moonY < hor + 10 && daylight < 0.8) {
    ctx.fillStyle = "rgba(226,232,240,0.9)";
    ctx.beginPath(); ctx.arc(moonX, moonY, 4, 0, 7); ctx.fill();
  }
  // dusk glow band
  var duskA = Math.max(0, 1 - Math.abs(daylight - 0.5) * 4);
  if (duskA > 0) {
    ctx.fillStyle = "rgba(" + C_DUSK[0] + "," + C_DUSK[1] + "," + C_DUSK[2] + "," + (duskA * 0.3).toFixed(2) + ")";
    ctx.fillRect(-8, hor - 12, W + 16, 12);
  }
  // lightning flash
  if (flashT > 0) {
    ctx.fillStyle = "rgba(255,255,255," + Math.min(0.8, flashT * 5).toFixed(2) + ")";
    ctx.fillRect(-8, -8, W + 16, H + 16);
  }

  // ground haze below horizon
  ctx.fillStyle = rgbStr(FOGC);
  ctx.fillRect(-8, hor, W + 16, H - hor + 8);

  // --- collect & sort drawables ---
  var tiles = [], items = [];
  var R = 16, cgx = Math.floor(cam.x), cgz = Math.floor(cam.z);
  var gx, gz, dx0, dz0, d2, dist;
  for (gz = cgz - R; gz <= cgz + R; gz++) for (gx = cgx - R; gx <= cgx + R; gx++) {
    if (gx < 0 || gz < 0 || gx >= MS || gz >= MS) continue;
    dx0 = gx + 0.5 - cam.x; dz0 = gz + 0.5 - cam.z;
    d2 = dx0 * dx0 + dz0 * dz0;
    if (d2 > R * R) continue;
    dist = Math.sqrt(d2);
    if (dist > 2.2 && dx0 * cam.f[0] + dz0 * cam.f[2] < -0.25 * dist) continue; // behind camera, never visible
    if (map[gz * MS + gx]) {
      addWall(gx, gz, items);
    } else {
      var even = (gx + gz) & 1;
      var col;
      if (lava[gz * MS + gx]) {
        var pulse = 0.75 + 0.25 * Math.sin(time * 3 + gx + gz);
        col = shadeC(amb([Math.round(200 * pulse), Math.round(50 * pulse), 20]), dist);
      } else {
        var bio = biomeOf(gx + 0.5, gz + 0.5);
        col = shadeCached(bio === 1 ? (even ? 7 : 8) : (bio === 2 ? (even ? 9 : 10) : (even ? 5 : 6)), dist);
      }
      var pts = [[gx, 0, gz], [gx + 1, 0, gz], [gx + 1, 0, gz + 1], [gx, 0, gz + 1]];
      tiles.push({ d: d2, draw: (function (p2, c) { return function () { drawQuad(p2, c); }; })(pts, col) });
    }
  }
  tiles.sort(sortByDepth);
  for (i = 0; i < tiles.length; i++) tiles[i].draw();

  // lamp glows at night
  if (daylight < 0.6) {
    var gi;
    for (gi = 0; gi < decor.length; gi++) {
      if (decor[gi].k !== "lamp") continue;
      var lx = decor[gi].x, lz = decor[gi].z;
      if (Math.hypot(lx - cam.x, lz - cam.z) > 12) continue;
      drawQuad([[lx - 1.5, 0.015, lz - 1.5], [lx + 1.5, 0.015, lz - 1.5], [lx + 1.5, 0.015, lz + 1.5], [lx - 1.5, 0.015, lz + 1.5]],
               "rgba(253,224,71," + (0.16 * (1 - daylight)).toFixed(2) + ")");
    }
  }

  // entities: decor props
  for (i = 0; i < decor.length; i++) {
    var dc = decor[i];
    var dcx0 = dc.x - cam.x, dcz0 = dc.z - cam.z;
    var dd2 = Math.sqrt(dcx0 * dcx0 + dcz0 * dcz0);
    if (dd2 > 34) continue;
    items.push({ d: dd2, draw: (function (dcx, dcz, dck) {
      return function () {
        if (dck === "tree") { drawShadow(dcx, dcz, 0.4); drawSprite(dcx, 0, dcz, TREE_BMP, 1.5, null); }
        else if (dck === "rock") { drawShadow(dcx, dcz, 0.35); drawSprite(dcx, 0, dcz, ROCK_BMP, 0.5, null); }
        else { drawShadow(dcx, dcz, 0.25); drawSprite(dcx, 0, dcz, LAMP_BMP, 1.7, null); }
      };
    })(dc.x, dc.z, dc.k) });
  }
  // barrels
  for (i = 0; i < barrels.length; i++) {
    var bb = barrels[i];
    if (bb.dead) continue;
    var bd2 = Math.hypot(bb.x - cam.x, bb.z - cam.z);
    if (bd2 > 34) continue;
    items.push({ d: bd2, draw: (function (bx, bz) {
      return function () { drawShadow(bx, bz, 0.35); drawSprite(bx, 0, bz, BARREL_BMP, 0.62, null); };
    })(bb.x, bb.z) });
  }
  // mines
  for (i = 0; i < mines.length; i++) {
    var mn2 = mines[i];
    var md2 = Math.hypot(mn2.x - cam.x, mn2.z - cam.z);
    if (md2 > 34) continue;
    items.push({ d: md2, draw: (function (mx2, mz2, mt2, marm) {
      return function () {
        drawShadow(mx2, mz2, 0.2);
        var blink = marm > 0 || Math.floor(mt2 * 6) % 2 === 0;
        drawSprite(mx2, 0.02, mz2, MINE_BMP, 0.28, blink ? null : PAL_MINE_OFF);
      };
    })(mn2.x, mn2.z, mn2.t, mn2.arm) });
  }

  // entities: enemies

function drawMinimap() {

  var mc, mgx, mgz, mwx, mwz;
  ctx.fillStyle = "#3f3f5e";
  for (mc = 0; mc < wallCells.length; mc++) {
    mgx = wallCells[mc] % MS; mgz = (wallCells[mc] - mgx) / MS;
    mwx = (mgx + 0.5 - player.x) * sc; mwz = (mgz + 0.5 - player.z) * sc;
    if (Math.abs(mwx) > half - 2 || Math.abs(mwz) > half - 2) continue;
    ctx.fillRect(cxm + mwx - 1, cym + mwz - 1, 2.5, 2.5);
  }
  // lava glow on minimap
  ctx.fillStyle = "#b91c1c";
  for (mc = 0; mc < lavaCells.length; mc++) {
    mgx = lavaCells[mc] % MS; mgz = (lavaCells[mc] - mgx) / MS;
    mwx = (mgx + 0.5 - player.x) * sc; mwz = (mgz + 0.5 - player.z) * sc;
    if (Math.abs(mwx) > half - 2 || Math.abs(mwz) > half - 2) continue;
    ctx.fillRect(cxm + mwx - 1, cym + mwz - 1, 2, 2);
  }
  for (i = 0; i < enemies.length; i++) {
    var en2 = enemies[i];
    var ex2 = (en2.x - player.x) * sc, ez2 = (en2.z - player.z) * sc;
    if (Math.abs(ex2) > half - 2 || Math.abs(ez2) > half - 2) continue;
    ctx.fillStyle = en2.type === "boss" ? "#ef4444" : (en2.type === "tank" ? "#a855f7" : (en2.type === "runner" ? "#fb923c" : (en2.type === "shield" ? "#3b82f6" : (en2.type === "splitter" ? "#14b8a6" : (en2.type === "kami" ? "#ef4444" : "#4ade80")))));

}
function handleTouchStart(ev) {

  var mb = melBtn ? melBtn.getBoundingClientRect() : null;
  var fr = fireBtn.getBoundingClientRect();
  var fcx = fr.left + fr.width / 2, fcy = fr.top + fr.height / 2;

window.addEventListener("touchstart", handleTouchStart, { passive: false });
window.addEventListener("touchmove", handleTouchMove, { passive: false });
window.addEventListener("touchend", handleTouchEnd, { passive: false });
window.addEventListener("touchcancel", handleTouchEnd, { passive: false });
touchEl.addEventListener("contextmenu", function (e) { e.preventDefault(); });

// ================= input =================
window.addEventListener("keydown", function (e) {
  initAudio();
  if (["Space", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Tab"].indexOf(e.code) >= 0) e.preventDefault();
  keys[e.code] = true;
  // menu navigation
  if (state === "title" || state === "menu" || state === "over") {
    var items = menuItems();
    if (e.code === "ArrowDown" || e.code === KP.b) { menuIdx = (menuIdx + 1) % items.length; beep(500, 0.03, "square", 0.04); return; }
    if (e.code === "ArrowUp" || e.code === KP.f) { menuIdx = (menuIdx - 1 + items.length) % items.length; beep(500, 0.03, "square", 0.04); return; }
    if (e.code === "Enter" || e.code === "Space" || e.code === "KeyX") { menuActivate(menuIdx); return; }
    if (e.code === "Escape" || e.code === "Backspace") {
      if (state === "menu") goBack();
      else if (state === "over") quitToTitle();
      return;
    }
    if (state === "title") {
      if (e.code === "KeyD") { cycleDiff(); return; }
      if (e.code === "KeyN") { newArena(); return; }
    }
    return;
  }
  if (state === "photo") {
    if (e.code === "Enter" || e.code === "Escape") { photoExit(); return; }
    if (e.code === "KeyP") { savePNG(); return; }
    return;
  }
  if (state !== "play") return;
  if (e.code === "Enter") return;
  if (e.code === "Tab") { if (enemies.length === 0 && waveGap > 0 && mode !== "train" && mode !== "camp") { shopOpen = !shopOpen; beep(500, 0.03, "square", 0.04); } return; }
  if (e.code === "KeyM") { toggleMute(); return; }
  if (e.code === "Escape" || e.code === "KeyP") { pauseOpen(false); return; }
  if (e.code === "KeyX") cycleWeapon();
  if (e.code === "KeyG") throwNade();
  if (e.code === "KeyB") dropMine();
  if (e.code === "KeyH") throwCluster();
  if (e.code === "KeyT") cycleThrowable();
  if (e.code === "KeyV") melee();
  if (e.code === "KeyC") doDash();
  // number keys: buy while the shop window is open, otherwise switch weapon — never both
  var shopWindow = enemies.length === 0 && waveGap > 0 && mode !== "train" && mode !== "camp";
  if (shopWindow) {
    var n9 = "1234567890".indexOf(e.key);
    if (n9 >= 0) buy(n9 === 9 ? 9 : n9);
  } else {
    if (e.code === "Digit1") switchWeapon("blaster");
    if (e.code === "Digit2") switchWeapon("spread");
    if (e.code === "Digit3") switchWeapon("rifle");
    if (e.code === "Digit4") switchWeapon("beam");
  }
});
window.addEventListener("keyup", function (e) { keys[e.code] = false; });
function toggleMute() {
  if (SET.vol > 0) { SET.lastVol = SET.vol; SET.vol = 0; toast("MUTED (M)", 1.5); }
  else { SET.vol = SET.lastVol || 0.8; toast("VOLUME " + Math.round(SET.vol * 10) + "/10", 1.5); }
  saveSettings();
}
window.addEventListener("blur", function () {
  for (var k in keys) keys[k] = false;
  mouseDown = false;
  touchFire = false; fireId = null; joyId = null; aimId = null; joyDx = 0; joyDy = 0;
  nadeHold = null;
  if (state === "play") pauseOpen(true);
});
document.addEventListener("visibilitychange", function () {
  if (document.hidden && state === "play") pauseOpen(true);
});
function pointerCanvas(e) {
  var r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
cv.addEventListener("mousedown", function (e) {
  initAudio();
  // menus are now clickable with a mouse (a click used to silently start a new game)
  if (state === "title" || state === "menu" || state === "over") {
    var cp = pointerCanvas(e), k, row = null;
    for (k = 0; k < menuRows.length; k++) {
      if (cp[0] >= menuRows[k].x0 && cp[0] <= menuRows[k].x1 && cp[1] >= menuRows[k].y0 && cp[1] <= menuRows[k].y1) row = menuRows[k];
    }
    if (row && row.idx !== undefined) { menuIdx = row.idx; menuActivate(row.idx); }
    return;
  }
  if (state !== "play") return; // photo mode etc. — ignore clicks
  mouseDown = true;
  try {
    if (cv.requestPointerLock) {
      var r = cv.requestPointerLock();
      if (r && r.catch) r.catch(function () {});
    }
  } catch (e2) {}
});
window.addEventListener("mouseup", function () { mouseDown = false; });
var lastMX = null;
document.addEventListener("mousemove", function (e) {
  if (state !== "play") { lastMX = null; return; }
  if (document.pointerLockElement === cv) { player.yaw += e.movementX * 0.0035 * (SET.sens || 1); lastMX = null; return; }
  // fallback when pointer lock is unavailable (embedded previews / some browsers): free mouse-steer
  if (lastMX !== null) {
    var dmx = e.clientX - lastMX;
    if (dmx > 60) dmx = 60; if (dmx < -60) dmx = -60; // clamp cursor jumps
    player.yaw += dmx * 0.005 * (SET.sens || 1);
  }
  lastMX = e.clientX;
});
cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });

// ================= gamepad =================
function pollPad() {
  padMx = 0; padMy = 0; padFire = false;
  var nav = window.navigator;
  if (!nav || !nav.getGamepads) return;
  var pads = nav.getGamepads(), gp = null, i;
  if (!pads) return;
  for (i = 0; i < pads.length; i++) if (pads[i] && pads[i].connected) { gp = pads[i]; break; }
  if (!gp) return;
  var ax = gp.axes || [], bt = gp.buttons || [];
  function btn(n) { return !!(bt[n] && (bt[n].pressed || bt[n].value > 0.5)); }
  if (state === "play") {
    if (ax.length > 1) { if (Math.abs(ax[0]) > 0.22) padMx = ax[0]; if (Math.abs(ax[1]) > 0.22) padMy = ax[1]; }
    if (ax.length > 2 && Math.abs(ax[2]) > 0.25) player.yaw += ax[2] * 0.085 * SET.sens;
    padFire = btn(7) || btn(5);
    if (btn(4) && !padPrev[0]) cycleWeapon();
    if (btn(2) && !padPrev[2]) throwCurrent();
    if (btn(9) && !padPrev[3]) pauseOpen(false);
  } else if (state === "title" || state === "menu" || state === "over") {
    if (btn(14) && !padPrev[0]) { menuIdx--; beep(500, 0.03, "square", 0.04); }
    if (btn(15) && !padPrev[1]) { menuIdx++; beep(500, 0.03, "square", 0.04); }
    var items = menuItems();
    if (menuIdx < 0) menuIdx = items.length - 1;
    if (menuIdx >= items.length) menuIdx = 0;
    if (btn(0) && !padPrev[2]) menuActivate(menuIdx);
    if (btn(1) && !padPrev[3]) { if (state === "menu") goBack(); else if (state === "over") quitToTitle(); }
  }
  padPrev = [btn(4), btn(15) || btn(14), btn(0) || btn(2), btn(9) || btn(1)];
}

// ================= main loop =================
genMap();
var last = performance.now();
function frame(now) {
  if (now - last > 0 && now - last < 13) { requestAnimationFrame(frame); return; } // cap ~60fps: halves load on 90/120Hz screens
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  fpsFrames++;
  fpsT += dt;
  if (fpsT >= 0.5) { fpsVal = Math.round(fpsFrames / fpsT); fpsFrames = 0; fpsT = 0; }
  shake = Math.max(0, shake - dt * 30);
  player.flash = Math.max(0, player.flash - dt * 1.5);
  pumpJingle();
  pollPad();
  pumpMusic();
  try {
    if (state === "play" || state === "title") update(dt); // title runs a slow camera drift
    render();
  } catch (err) { if (typeof console !== "undefined" && console.error) console.error(err); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
